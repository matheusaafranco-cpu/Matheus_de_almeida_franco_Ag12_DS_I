<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título da aba da página -->
    <title>Meus sites favoritos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .site-container {
            background: #fff;
            margin: 20px auto;
            padding: 20px;
            width: 60%;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        img {
            width: 300px;
            height: 180px;
            object-fit: cover;
            border-radius: 5px;
            border: 2px solid #ddd;
            margin-bottom: 10px;
        }
        a {
            display: inline-block;
            color: #0066cc;
            text-decoration: none;
            font-weight: bold;
            margin-top: 5px;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Título do corpo da página -->
    <h1>Meus sites favoritos: Matheus de Almeida Franco</h1>

    <!-- Site 1: YouTube -->
    <div class="site-container">
        <!-- Nome do site usando a tag h1 conforme pedido -->
        <h1>YouTube</h1>
        <!-- Imagem representativa do site -->
        <a href="https://www.youtube.com" target="_blank">
            <img src="https://images.unsplash.com/photo-1611162617474-5b21e879e113?w=500&auto=format&fit=crop&q=60" alt="YouTube">
        </a><br>
        <!-- Link para o site abaixo da imagem -->
        <a href="https://www.youtube.com" target="_blank">Acessar YouTube</a>
    </div>

    <!-- Site 2: Spotify -->
    <div class="site-container">
        <h1>Spotify</h1>
        <a href="https://www.spotify.com" target="_blank">
            <img src="https://images.unsplash.com/photo-1614680376593-902f749f7ffc?w=500&auto=format&fit=crop&q=60" alt="Spotify">
        </a><br>
        <a href="https://www.spotify.com" target="_blank">Acessar Spotify</a>
    </div>

    <!-- Site 3: GitHub -->
    <div class="site-container">
        <h1>GitHub</h1>
        <a href="https://github.com" target="_blank">
            <img src="https://images.unsplash.com/photo-1618401471353-b98aedd04e11?w=500&auto=format&fit=crop&q=60" alt="GitHub">
        </a><br>
        <a href="https://github.com" target="_blank">Acessar GitHub</a>
    </div>

    <!-- Site 4: Google -->
    <div class="site-container">
        <h1>Google</h1>
        <a href="https://www.google.com" target="_blank">
            <img src="https://images.unsplash.com/photo-1573804633927-bfcbcd909acd?w=500&auto=format&fit=crop&q=60" alt="Google">
        </a><br>
        <a href="https://www.google.com" target="_blank">Acessar Google</a>
    </div>

    <!-- Site 5: Instagram -->
    <div class="site-container">
        <h1>Instagram</h1>
        <a href="https://www.instagram.com" target="_blank">
            <img src="https://images.unsplash.com/photo-1611262588024-d12430b98920?w=500&auto=format&fit=crop&q=60" alt="Instagram">
        </a><br>
        <a href="https://www.instagram.com" target="_blank">Acessar Instagram</a>
    </div>

</body>
</html>
